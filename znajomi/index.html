<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Znajomi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/style-glowne.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <div class="nav-left">
                <a href="/index.html">STRONA GŁÓWNA</a>
                <a href="/uczelnia/index.html">O UCZELNI</a>
                <a href="/statystyki/index.html">PROFIL</a>
                <a href="index.html">ZNAJOMI</a>
            </div>
            <div class="nav-right">
                <img src="/images/pl.png" alt="PL" class="lang-btn" data-lang="pl">
                <img src="/images/en.png" alt="EN" class="lang-btn" data-lang="en">
                <img src="/images/power-off.png" alt="logout" id="user-profile" class="profile" onclick="toggleMenu()" id="profile-icon">
                <div id="profile-icon"></div>
                <div id="profile-menu" class="menu">
                    <div id="profile-email" class="menu-email"></div>
                    <button onclick="logout()">Wyloguj</button>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <h1>
            <span class="znajomi"><span class="first-letter">Z</span>najomi</span>
        </h1>
        
        <!-- Wyszukiwanie użytkowników -->
        <div class="search-section">
            <h2>Szukaj użytkowników</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Wpisz nazwę użytkownika...">
                <button onclick="searchUsers()">Szukaj</button>
            </div>
            <div id="searchResults" class="user-list"></div>
        </div>

        <!-- Zaproszenia -->
        <div class="requests-section">
            <h2>Zaproszenia do znajomych (<span id="requestCount">0</span>)</h2>
            <div id="friendRequests" class="user-list"></div>
        </div>

        <!-- Zaproszenia do gier -->
        <div class="game-invitations-section">
            <h2>Zaproszenia do gier (<span id="gameInvitationCount">0</span>)</h2>
            <div id="gameInvitations" class="user-list"></div>
        </div>

        <!-- Lista znajomych -->
        <div class="friends-section">
            <h2>Moi znajomi (<span id="friendCount">0</span>)</h2>
            <div id="friendsList" class="user-list"></div>
        </div>

        <div class="actions">
            <button onclick="window.location.href='/'" class="btn-secondary">Powrót</button>
            <button onclick="logout()" class="btn-danger">Wyloguj</button>
        </div>
    </div>

    <!-- Modal wyboru gry -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Wybierz grę</h2>
                <span class="close" onclick="closeGameModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Do jakiej gry chcesz zaprosić <strong id="invitedUsername"></strong>?</p>
                <div class="game-options">
                    <div class="game-card" onclick="selectGame('wielka-studencka-batalla')">
                        <div class="game-icon"></div>
                        <div class="game-name">Wielka Studencka Batalla</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="../js/toast.js"></script>
    <script src="script.js"></script>
</body>
</html>
