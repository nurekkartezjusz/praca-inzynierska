<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/toast.css">
    <title>Resetowanie hasła</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>Wielka</h1>
            <h1>Studencka</h1>
            <h1>Batalia</h1>
        </div>
        <div class="logow">
            <div class="password-recovery card" id="step1">
                <h2>Resetowanie hasła - Krok 1</h2>
                <p>Podaj email, a otrzymasz 6-cyfrowy kod do resetowania hasła.</p>
                <div class="field">
                    <input type="text" id="email" required placeholder=" ">
                    <label for="email">Adres e-mail powiązany z kontem</label>
                </div>
                <div id="error-message" style="color: #B30000; margin-bottom: 10px; display: none; font-family: 'Space Grotesk';"></div>
                <button class="reset-password" id="request-token-btn">Wyślij kod resetowania</button>
            </div>

            <div class="password-recovery card" id="step2" style="display: none;">
                <h2>Resetowanie hasła - Krok 2</h2>
                <p>
                    Kod został wysłany! Wpisz go poniżej wraz z nowym hasłem.
                </p>
                <div class="field">
                    <input type="text" id="reset-token" required maxlength="6" placeholder=" ">
                    <label for="reset-token">Kod resetowania (6 cyfr)</label>
                </div>
                <div class="field">
                    <label for="new-password">Nowe hasło (min. 6 znaków)</label>
                    <div class="input-box">
                        <input type="password" id="new-password" class="password-input" autocomplete="new-password" required placeholder=" ">
                        <img src="img/hide.png" alt="view" class="eye-icon">
                    </div>
                    <div class="password-strength" id="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-text" id="strength-text"></span>
                    </div>
                    <ul class="password-requirements" id="password-requirements">
                        <li id="req-length">✗ Minimum 6 znaków</li>
                        <li id="req-letter">✗ Zawiera literę</li>
                        <li id="req-number">✗ Zawiera cyfrę</li>
                    </ul>
                </div>
                <div class="field">
                    <input type="password" id="confirm-password" class="password-input" required placeholder=" ">
                    <label for="confirm-password">Potwierdź nowe hasło</label>
                    <img src="img/hide.png" alt="view" class="eye-icon"> 
                </div>
                <div id="error-message-2" style="color: #6562A9; margin-bottom: 10px; display: none; font-family: 'Space Grotesk';"></div>
                <div id="success-message" style="color: #9A87B4; margin-bottom: 10px; display: none; font-family: 'Space Grotesk';"></div>
                <div class="reset-actions">
                    <button class="reset-password" id="back-btn">Zmień e-mail</button>
                    <button class="reset-password" id="reset-password-btn">Zresetuj hasło</button>
                </div>
            </div>

            <div class="login card">
                <h2>Masz konto? Zaloguj się</h2>
                <button class="logowanie" onclick="window.location.href = '../logowanie/index.html'">Zaloguj się</button>
            </div>
        </div>
    </div>


    <script src="../js/toast.js"></script>
    <script>
        const API_URL = '/api';
        const newPasswordInput = document.getElementById('new-password');

        function getPasswordRequirements(password) {
            return {
                hasLength: password.length >= 6,
                hasLetter: /[a-zA-Z]/.test(password),
                hasNumber: /[0-9]/.test(password)
            };
        }

        function updatePasswordStrength() {
            const password = newPasswordInput.value;
            const strengthDiv = document.getElementById('password-strength');
            const strengthFill = document.getElementById('strength-fill');
            const strengthText = document.getElementById('strength-text');
            const requirementsDiv = document.getElementById('password-requirements');

            if (!password) {
                strengthDiv.classList.remove('is-visible');
                requirementsDiv.classList.remove('is-visible');
                return;
            }

            strengthDiv.classList.add('is-visible');
            requirementsDiv.classList.add('is-visible');

            const requirements = getPasswordRequirements(password);
            document.getElementById('req-length').className = requirements.hasLength ? 'met' : '';
            document.getElementById('req-letter').className = requirements.hasLetter ? 'met' : '';
            document.getElementById('req-number').className = requirements.hasNumber ? 'met' : '';

            const strength = Object.values(requirements).filter(Boolean).length;
            strengthFill.className = 'strength-fill';
            if (strength === 3) {
                strengthFill.classList.add('strong');
                strengthText.textContent = 'Silne hasło';
                strengthText.style.color = '#28a745';
            } else if (strength === 2) {
                strengthFill.classList.add('medium');
                strengthText.textContent = 'Średnie hasło';
                strengthText.style.color = '#ffc107';
            } else {
                strengthFill.classList.add('weak');
                strengthText.textContent = 'Słabe hasło';
                strengthText.style.color = '#dc3545';
            }
        }

        newPasswordInput.addEventListener('input', updatePasswordStrength);

        // Krok 1: Żądanie tokenu resetowania
        document.getElementById('request-token-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error-message');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!email || !email.includes('@')) {
                errorDiv.textContent = 'Proszę podać poprawny adres e-mail';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/password-reset-request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                // Sprawdź czy odpowiedź ma treść przed parsowaniem JSON
                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const text = await response.text();
                    if (text) {
                        data = JSON.parse(text);
                    } else {
                        data = {};
                    }
                } else {
                    data = {};
                }

                if (response.ok) {
                    // Pokaż krok 2
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'flex';
                    
                    // Sprawdź, czy email został wysłany czy to tryb dev
                    if (data.email_sent) {
                        showSuccess('Kod resetowania został wysłany na Twój email!');
                    } else if (data.token) {
                        // Tryb deweloperski - pokaż token
                        showInfo(`Kod resetowania: ${data.token}`, 'Tryb deweloperski', 10000);
                    }
                } else {
                    errorDiv.textContent = data.detail || 'Błąd podczas żądania resetowania';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Błąd połączenia z serwerem: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        // Krok 2: Resetowanie hasła z tokenem
        document.getElementById('reset-password-btn').addEventListener('click', async function() {
            const email = document.getElementById('email').value;
            const token = document.getElementById('reset-token').value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error-message-2');

            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!token || token.length !== 6) {
                errorDiv.textContent = 'Proszę podać 6-cyfrowy kod resetowania';
                errorDiv.style.display = 'block';
                return;
            }

            const passwordRequirements = getPasswordRequirements(newPassword);
            if (!passwordRequirements.hasLength || !passwordRequirements.hasLetter || !passwordRequirements.hasNumber) {
                errorDiv.textContent = 'Hasło musi mieć co najmniej 6 znaków oraz zawierać literę i cyfrę';
                errorDiv.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = 'Hasła się nie zgadzają';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/password-reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        token: token,
                        new_password: newPassword
                    })
                });

                // Sprawdź czy odpowiedź ma treść przed parsowaniem JSON
                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const text = await response.text();
                    if (text) {
                        data = JSON.parse(text);
                    } else {
                        data = {};
                    }
                } else {
                    data = {};
                }

                if (response.ok) {
                    showSuccess('Hasło zostało zresetowane pomyślnie! Możesz się teraz zalogować.');
                    setTimeout(() => {
                        window.location.href = '../logowanie/index.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.detail || 'Błąd podczas resetowania hasła';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Błąd połączenia z serwerem: ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        // Przycisk "Wróć"
        document.getElementById('back-btn').addEventListener('click', function() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'flex';
            document.getElementById('email').value = '';
            document.getElementById('reset-token').value = '';
            newPasswordInput.value = '';
            updatePasswordStrength();
            document.getElementById('confirm-password').value = '';
        });
    </script>
    <script>
        const eyeIcons = document.querySelectorAll(".eye-icon");

        eyeIcons.forEach(icon => {
            icon.addEventListener("click", () =>{
                const input = icon.parentElement.querySelector(".password-input");

                if(input.type === "password"){
                    input.type = "text";
                    icon.src = "img/view.png";
                }else{
                    input.type = "password";
                    icon.src = "img/hide.png";
                }
            })
            
        });
    </script>
</body>
</html>
