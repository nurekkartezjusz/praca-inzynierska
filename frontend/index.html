<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Strona Główna</title>
    <meta name="description" content="Wielka Studencka Batalia" />
    <link rel="preload" as="image" href="/images/Illustration.png">
    <link rel="preload" as="image" href="/images/Illustrationmobile.png">
    <link rel="stylesheet" href="/css/style-glowne.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>
<body class="responsive-nav home-page">
    
    <header class="topbar">
        <nav class="nav">
            <button class="nav-toggle" type="button" aria-label="Otwórz menu" aria-controls="mobile-navigation" aria-expanded="false" onclick="toggleNavigation()">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-left" id="mobile-navigation" aria-hidden="false">
                <div class="nav-links">
                    <a href="/index.html" aria-current="page">START</a>
                    <a href="/uczelnia/index.html">O UCZELNI</a>
                    <a href="/statystyki/index.html">PROFIL</a>
                    <a href="/znajomi/index.html">ZNAJOMI</a>
                </div>
                <div class="mobile-nav-footer">
                    <div class="mobile-languages">
                        <button class="language-option" type="button" data-lang="pl" aria-label="Język polski">
                            <img src="/images/pl.png" alt="" class="lang-btn"> Polski
                        </button>
                        <button class="language-option" type="button" data-lang="en" aria-label="Język angielski">
                            <img src="/images/en.png" alt="" class="lang-btn"> English
                        </button>
                    </div>
                    <button class="nav-logout" type="button" onclick="logout()">
                        <img src="/images/power-off.png" alt=""> Wyloguj
                    </button>
                </div>
            </div>
            <div class="nav-right">
                <img src="/images/pl.png" alt="PL" class="lang-btn" data-lang="pl">
                <img src="/images/en.png" alt="EN" class="lang-btn" data-lang="en">
                <img src="/images/power-off.png" alt="logout" id="user-profile" class="profile" onclick="toggleMenu()" id="profile-icon">
                <div id="profile-icon"></div>
                <div id="profile-menu" class="menu">
                    <div id="profile-email" class="menu-email"></div>
                    <button onclick="logout()">Wyloguj</button>
                </div>
            </div>
        </nav>
        <button class="nav-backdrop" type="button" aria-label="Zamknij menu" onclick="toggleNavigation(false)"></button>
    </header>
    <section class="hero">
        <div class="hero-content">
            <h1>
                WIELKA <br>
                STUDENCKA <br>
                BATALIA
            </h1>
            <p>
                Rozpocznij przygodę na planszy <span class="keep-together">pełnej wyzwań:</span><br>
                Graj z znajomymi, rzucaj kostką i baw się dobrze!
            </p>
            <div class="hero-actions">
                <a href="plansza/index.html" class="btn" id="play-game-btn">
                    <span id="play-game-label">ZAGRAJ</span>
                    <span class="side-left"></span>
                    <span class="side-right"></span>
                    <span class="corner corner-tl"></span>
                    <span class="corner corner-tr"></span>
                    <span class="corner corner-bl"></span>
                    <span class="corner corner-br"></span>
                </a>
                <a href="plansza/index.html" class="btn" id="resume-game-btn" hidden>
                    KONTYNUUJ
                    <span class="side-left"></span>
                    <span class="side-right"></span>
                    <span class="corner corner-tl"></span>
                    <span class="corner corner-tr"></span>
                    <span class="corner corner-bl"></span>
                    <span class="corner corner-br"></span>
                </a>
            </div>
        </div>
    </section>
  

    <script>
        const API_URL = '/api';

        // Sprawdź czy użytkownik jest zalogowany
        async function checkAuth() {
            const token = localStorage.getItem('access_token');
            const email = localStorage.getItem('user_email');

            if (!token || !email) {
                // Nie zalogowany - przekieruj do logowania
                window.location.href = 'logowanie/index.html';
                return;
            }

            try {
                // Sprawdź czy token jest ważny
                const response = await fetch(`${API_URL}/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    // Sprawdź czy odpowiedź ma treść przed parsowaniem JSON
                    let userData;
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        const text = await response.text();
                        if (text) {
                            userData = JSON.parse(text);
                        } else {
                            userData = {};
                        }
                    } else {
                        userData = {};
                    }
                    
                    // Sprawdź czy użytkownik ma awatar - jeśli nie, przekieruj do kreatora
                    if (!userData.avatar) {
                        window.location.href = 'wybor awatara/index.html?new=true';
                        return;
                    }
                    
                    // Zalogowany - pokaż profil
                    document.getElementById('user-profile').classList.add('logged-in');
                    document.getElementById('profile-email').textContent = userData.email;
                    
                    // Ustaw inicjał użytkownika
                    const initial = userData.username ? userData.username[0].toUpperCase() : userData.email[0].toUpperCase();
                    document.getElementById('profile-icon').textContent = initial;

                    try {
                        const resumableResponse = await fetch(`${API_URL}/game-sessions/resumable`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (resumableResponse.ok) {
                            const resumableGame = await resumableResponse.json();
                            if (resumableGame.invitation_id) {
                                const resumeButton = document.getElementById('resume-game-btn');
                                resumeButton.href = `plansza/index.html?invite_accepted=${encodeURIComponent(resumableGame.invitation_id)}&resume=1`;
                                resumeButton.hidden = false;
                                document.getElementById('play-game-label').textContent = 'NOWA GRA';
                            }
                        }
                    } catch (error) {
                        console.error('Błąd sprawdzania zapisanej gry:', error);
                    }
                } else {
                    // Token nieważny - przekieruj do logowania
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('user_email');
                    window.location.href = 'logowanie/index.html';
                }
            } catch (error) {
                console.error('Błąd sprawdzania autoryzacji:', error);
                // Błąd - przekieruj do logowania
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_email');
                window.location.href = 'logowanie/index.html';
            }
        }

        // Toggle menu
        function toggleMenu() {
            const menu = document.getElementById('profile-menu');
            menu.classList.toggle('show');
        }

        function toggleNavigation(forceOpen) {
            const toggle = document.querySelector('.nav-toggle');
            const menu = document.getElementById('mobile-navigation');
            const backdrop = document.querySelector('.nav-backdrop');
            const isOpen = forceOpen ?? toggle.getAttribute('aria-expanded') !== 'true';

            toggle.setAttribute('aria-expanded', String(isOpen));
            toggle.setAttribute('aria-label', isOpen ? 'Zamknij menu' : 'Otwórz menu');
            menu.setAttribute('aria-hidden', String(!isOpen));
            menu.classList.toggle('is-open', isOpen);
            backdrop.classList.toggle('is-open', isOpen);
            document.body.classList.toggle('nav-open', isOpen);
            if (isOpen) {
                menu.querySelector('a').focus();
            } else if (menu.contains(document.activeElement)) {
                toggle.focus();
            }
        }

        document.querySelectorAll('#mobile-navigation .nav-links a').forEach(function(link) {
            link.addEventListener('click', function() {
                toggleNavigation(false);
            });
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && document.querySelector('.nav-toggle').getAttribute('aria-expanded') === 'true') {
                toggleNavigation(false);
                document.querySelector('.nav-toggle').focus();
            }
        });

        // Zamknij menu po kliknięciu poza nim
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('profile-menu');
            const profile = document.getElementById('user-profile');
            if (!profile.contains(e.target) && menu.classList.contains('show')) {
                menu.classList.remove('show');
            }
        });

        // Wyloguj
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_email');
            window.location.reload();
        }

        // Sprawdź autoryzację przy załadowaniu strony
        checkAuth();
    </script>
</body>
</html>
