<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Znajomi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/style-glowne.css">
    <link rel="stylesheet" href="../css/nav.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">
</head>
<body class="responsive-nav">
    <header class="topbar">
        <nav class="nav">
            <button class="nav-toggle" type="button" aria-label="Otwórz menu" aria-controls="mobile-navigation" aria-expanded="false" onclick="toggleNavigation()">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-left" id="mobile-navigation" aria-hidden="false">
                <div class="nav-links">
                    <a href="/index.html">START</a>
                    <a href="/uczelnia/index.html">O UCZELNI</a>
                    <a href="/statystyki/index.html">PROFIL</a>
                    <a href="/znajomi/index.html" aria-current="page">ZNAJOMI</a>
                </div>
                <div class="mobile-nav-footer">
                    <div class="mobile-languages">
                        <button class="language-option" type="button" data-lang="pl" aria-label="Język polski">
                            <img src="/images/pl.png" alt="" class="lang-btn"> Polski
                        </button>
                        <button class="language-option" type="button" data-lang="en" aria-label="Język angielski">
                            <img src="/images/en.png" alt="" class="lang-btn"> English
                        </button>
                    </div>
                    <button class="nav-logout" type="button" onclick="logout()">
                        <img src="/images/power-off.png" alt=""> Wyloguj
                    </button>
                </div>
            </div>
            <div class="nav-right">
                <img src="/images/pl.png" alt="PL" class="lang-btn" data-lang="pl">
                <img src="/images/en.png" alt="EN" class="lang-btn" data-lang="en">
                <img src="/images/power-off.png" alt="logout" id="user-profile" class="profile" onclick="toggleMenu()" id="profile-icon">
                <div id="profile-icon"></div>
                <div id="profile-menu" class="menu">
                    <div id="profile-email" class="menu-email"></div>
                    <button onclick="logout()">Wyloguj</button>
                </div>
            </div>
        </nav>
        <button class="nav-backdrop" type="button" aria-label="Zamknij menu" onclick="toggleNavigation(false)"></button>
    </header>
    <div class="container">
        <h1>
            <span class="znajomi"><span class="first-letter">Z</span>najomi</span>
        </h1>
        
        <!-- Wyszukiwanie użytkowników -->
        <div class="search-section">
            <h2>Szukaj użytkowników</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Wpisz nazwę użytkownika...">
                <button onclick="searchUsers()">Szukaj</button>
            </div>
            <div id="searchResults" class="user-list"></div>
        </div>

        <!-- Zaproszenia -->
        <div class="requests-section">
            <h2>Zaproszenia do znajomych (<span id="requestCount">0</span>)</h2>
            <div id="friendRequests" class="user-list"></div>
        </div>

        <!-- Zaproszenia do gier -->
        <div class="game-invitations-section">
            <h2>Zaproszenia do gier (<span id="gameInvitationCount">0</span>)</h2>
            <div id="gameInvitations" class="user-list"></div>
        </div>

        <!-- Lista znajomych -->
        <div class="friends-section">
            <h2>Moi znajomi (<span id="friendCount">0</span>)</h2>
            <div id="friendsList" class="user-list"></div>
        </div>

        
    </div>

    <!-- Modal wyboru gry -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Wybierz grę</h2>
                <span class="close" onclick="closeGameModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>Do jakiej gry chcesz zaprosić <strong id="invitedUsername"></strong>?</p>
                <div class="game-options">
                    <div class="game-card" onclick="selectGame('wielka-studencka-batalla')">
                        <div class="game-icon"></div>
                        <div class="game-name">Wielka Studencka Batalla</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>
    <script src="../js/toast.js"></script>
    <script src="../js/profile-menu.js"></script>
    <script src="script.js"></script>
    <script>
        function toggleNavigation(forceOpen) {
            const toggle = document.querySelector('.nav-toggle');
            const menu = document.getElementById('mobile-navigation');
            const backdrop = document.querySelector('.nav-backdrop');
            const isOpen = forceOpen ?? toggle.getAttribute('aria-expanded') !== 'true';
            toggle.setAttribute('aria-expanded', String(isOpen));
            toggle.setAttribute('aria-label', isOpen ? 'Zamknij menu' : 'Otwórz menu');
            menu.setAttribute('aria-hidden', String(!isOpen));
            menu.classList.toggle('is-open', isOpen);
            backdrop.classList.toggle('is-open', isOpen);
            document.body.classList.toggle('nav-open', isOpen);
            if (isOpen) menu.querySelector('a').focus();
            else if (menu.contains(document.activeElement)) toggle.focus();
        }

        document.querySelectorAll('#mobile-navigation .nav-links a').forEach(function(link) {
            link.addEventListener('click', function() { toggleNavigation(false); });
        });
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && document.querySelector('.nav-toggle').getAttribute('aria-expanded') === 'true') {
                toggleNavigation(false);
            }
        });
    </script>
</body>
</html>
